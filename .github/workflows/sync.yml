name: Trackman sync

on:
  schedule:
    - cron: "17 2 * * *"   # nightly, ~10pm Eastern
  workflow_dispatch:
    inputs:
      resync_all:
        description: "Re-download every activity"
        type: boolean
        default: false

concurrency: trackman-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull new sessions
        env:
          TRACKMAN_CLIENT_ID: ${{ secrets.TRACKMAN_CLIENT_ID }}
          TRACKMAN_REFRESH_TOKEN: ${{ secrets.TRACKMAN_REFRESH_TOKEN }}
          RESYNC_ALL: ${{ inputs.resync_all }}
        run: python trackman_sync.py

      # Runs even if the pull failed, so a rotated token is never lost.
      - name: Save rotated refresh token
        if: always()
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python save_refresh_token.py

      - name: Commit data
        run: |
          git config user.name "trackman-sync"
          git config user.email "trackman-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sync Trackman sessions $(date -u +%F)"
          git push
