name: Process Trackman uploads

# The "Sync Trackman" iOS Shortcut uploads raw session data to data/inbox/.
# This turns each upload into CSV files.
on:
  push:
    paths:
      - "data/inbox/**"
  workflow_dispatch:

concurrency: trackman-sync

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python process_inbox.py

      - name: Commit results
        run: |
          git config user.name "trackman-sync"
          git config user.email "trackman-sync@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Process Trackman upload $(date -u +%F)"
          git push
