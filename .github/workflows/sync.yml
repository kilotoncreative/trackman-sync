name: Trackman sync

on:
  schedule:
    - cron: "17 2 * * *"   # nightly, ~10pm Eastern
  workflow_dispatch:
    inputs:
      resync_all:
        description: "Re-download every activity"
        type: boolean
        default: false

concurrency: trackman-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Saved browser session from the last run, so most runs skip login.
      - name: Restore Trackman session
        uses: actions/cache/restore@v4
        with:
          path: .auth
          key: trackman-auth-${{ github.run_id }}
          restore-keys: trackman-auth-

      - name: Pull new sessions
        env:
          TRACKMAN_EMAIL: ${{ secrets.TRACKMAN_EMAIL }}
          TRACKMAN_PASSWORD: ${{ secrets.TRACKMAN_PASSWORD }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESYNC_ALL: ${{ inputs.resync_all }}
        run: python trackman_sync.py

      - name: Save Trackman session
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .auth
          key: trackman-auth-${{ github.run_id }}

      - name: Upload login screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "trackman-sync"
          git config user.email "trackman-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sync Trackman sessions $(date -u +%F)"
          git push
